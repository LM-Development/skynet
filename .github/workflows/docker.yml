name: Docker Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubunt-latest
    strategy:
      fail-fast: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: ghcr.io/${{ github.repository }}:latest
          push: true
          build-args: |
            BUILD_WITH_VLLM=0
